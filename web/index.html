<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Spring: sigue tu ciclo menstrual, síntomas y predicciones día a día.">
  <meta name="theme-color" content="#8E6BE8">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Spring">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Spring</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FAF8FF; }
    #shell {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #F4F0FF 0%, #FAF8FF 100%);
      color: #5B3FA0; transition: opacity .25s ease;
    }
    #shell .moon {
      width: 64px; height: 64px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FFF7E8 0 55%, #E9E3FF 56%);
      box-shadow: 0 8px 24px rgba(142, 107, 232, .35);
      animation: pulse 1.4s ease-in-out infinite;
    }
    #shell h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: .2px; }
    #shell p { margin: 0; color: #7A7192; font-size: 15px; }
    @keyframes pulse { 50% { transform: scale(.92); opacity: .75; } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #241C3D; }
      #shell { background: #241C3D; color: #E9E3FF; }
      #shell p { color: #B9AED6; }
    }
    @media (prefers-reduced-motion: reduce) { #shell .moon { animation: none; } }
  </style>

  <script src="perf/web_vitals.js"></script>
</head>
<body>
  <div id="shell" aria-busy="true">
    <div class="moon" aria-hidden="true"></div>
    <h1>Spring</h1>
    <p>Sigue tu ciclo, día a día.</p>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var shell = document.getElementById('shell');
      if (!shell) return;
      shell.style.opacity = '0';
      setTimeout(function () { shell.remove(); }, 300);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function () {
          if (window.springVitals) window.springVitals.serviceWorker = true;
        }).catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
